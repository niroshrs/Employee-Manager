<!DOCTYPE html>
<html>
<head>
    <title>Create Employee</title>
    
    {%load static%}
    
    <link rel="stylesheet" href="{% static 'create_emp.css' %}">
    <video class='video' autoplay muted loop id="bg-video" style="width: 100%;">
        <source src="{% static 'video/background.mp4' %}" type="video/mp4">
    </video>
</head>
<body>
    <div class="image">
        <img src="{% static 'image/images.png' %}" alt="Employee Image">
    </div>
    <div class="userLogin">
        <h1>Create Employee</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class='label' for="emp_id">Emp ID</label>
                <input class='iBox' id='emp_id' type="number" name="emp_id">
            </div>
            <div class="form-group">
                <label class='label' for="name">Name</label>
                <input class='iBox' type="text" name="name" placeholder="  eg : Joe">
            </div>
            <div class="form-group">
                <label class='label' for="email">Email</label>
                <input class='iBox' type="email" name="email" placeholder="  example@gmail.com">
            </div> 
            
            <div class="form-group">
                <label class='label' for="password">Password</label>
                <input class='iBox' type="password" name="password" >
            </div>
            
             
            <div class="form-group">
                <label class='label' for="number">Phone number</label>
                <input class='iBox'type="text" name="mob_no" placeholder="  eg: +91 XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label class='label' for="salary">Salary</label>
                <input class='iBox' type="number" name="salary">
            </div>
            <div class="form-group">
                <label class='label' for="title">Title</label>
                <input class='iBox' type="text" name="title" >
            </div>
            
            <div class="btn-create">
                <button class="submit" type="submit"><b>Submit</b></button>
                <button class='goBack' onclick="window.location.href='/employee'">
                    <b>Go Back</b>
                </button>
            </div>
        </form>    
    </div>
</body>
</html>
